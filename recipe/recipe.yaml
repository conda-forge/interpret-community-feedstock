schema_version: 1

context:
  name: interpret-community
  version: 0.33.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/interpret_community-${{ version }}.tar.gz
  sha256: 9cc18cad4cf80482f5ee88cd01a441e530a94ee985e632a5ea99b4b5605adcdd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - scipy
    - ml-wrappers >=0.6.4,<0.7.dev0
    - scikit-learn
    - packaging
    - interpret-core >=0.1.20,<=0.6.9
    - shap >=0.20.0,<=0.46.0
    - raiutils >=0.4.0,<0.5.dev0
tests:
  - python:
      imports:
        - interpret_community
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Microsoft Interpret Extensions SDK for Python
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/interpretml/interpret-community

extra:
  recipe-maintainers:
    - rxm7706
